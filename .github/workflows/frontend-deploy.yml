
name: HavLook Frontend CI/CD - Cloudflare

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: havlook-frontend-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy HavLook Frontend

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.havlook.com
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # 3. Install locked dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Security audit
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      # 5. Build Cloudflare Worker
      - name: Build Next.js for Cloudflare
        run: npm run cf:build

      # 6. Verify Cloudflare Free plan bundle limit
      - name: Verify Worker bundle size
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler deploy --dry-run \
            --outdir /tmp/havlook-worker-build \
            2>&1 | tee /tmp/worker-size.log

          GZIP_KIB=$(sed -nE \
            's/.*gzip: ([0-9.]+) KiB.*/\1/p' \
            /tmp/worker-size.log | tail -1)

          if [ -z "$GZIP_KIB" ]; then
            echo "::error::Could not determine Worker bundle size"
            exit 1
          fi

          echo "Compressed Worker size: $GZIP_KIB KiB"

          awk -v size="$GZIP_KIB" 'BEGIN {
            if (size > 3072) {
              print "Worker exceeds Cloudflare Free plan limit"
              exit 1
            }
            print "Worker fits Cloudflare Free plan limit"
          }'

          echo "Worker bundle: $GZIP_KIB KiB" >> "$GITHUB_STEP_SUMMARY"

      # 7. Deploy to existing Cloudflare Worker
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy

      # 8. Verify live application
      - name: Verify live frontend
        shell: bash
        run: |
          set -euo pipefail

          FRONTEND_URL="https://havlook-frontend.saadkhan0872.workers.dev"

          for route in / /products /login /signup /cart /admin/login /seller/login; do

            echo "Checking $FRONTEND_URL$route"

            STATUS=$(curl --fail --silent --show-error \
              --retry 3 \
              --retry-delay 5 \
              --max-time 30 \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$FRONTEND_URL$route")

            if [ "$STATUS" != "200" ]; then
              echo "::error::Route $route returned HTTP $STATUS"
              exit 1
            fi

            echo "Passed: $route - HTTP $STATUS"

          done

      # 9. Verify backend connectivity
      - name: Verify backend health
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --max-time 15 \
            https://api.havlook.com/api/health

      # 10. Generate deployment summary
      - name: Deployment summary
        run: |
          echo "## HavLook Frontend Deployment Success" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform: Cloudflare Workers" >> "$GITHUB_STEP_SUMMARY"
          echo "- Framework: Next.js + OpenNext" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: Production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: main" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: https://havlook-frontend.saadkhan0872.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend: https://api.havlook.com" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend route checks: Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend HTTP health check: Passed" >> "$GITHUB_STEP_SUMMARY"
